name: Notion Content Calendar

on:
  pull_request:
    types: [closed]
    branches: [main, master]

jobs:
  create-notion-page:
    if: |
      github.event.pull_request.merged == true &&
      (startsWith(github.event.pull_request.title, 'feat:') ||
       startsWith(github.event.pull_request.title, 'feat(') ||
       contains(toJson(github.event.pull_request.labels.*.name), 'feature'))
    runs-on: ubuntu-latest

    steps:
      - name: Parse PR body for content fields
        id: parse
        uses: actions/github-script@v9
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const extract = (label) => {
              const re = new RegExp(`\\*\\*${label}\\*\\*[:\\s]+([^\\n]+)`, 'i');
              const m = body.match(re);
              return m ? m[1].trim() : '';
            };
            const platforms = extract('Platforms');
            const hook = extract('Hook');
            const benefits = extract('Key Benefits');
            const tone = extract('Tone');
            core.setOutput('platforms', platforms || 'LinkedIn, Twitter/X');
            core.setOutput('hook', hook || '');
            core.setOutput('benefits', benefits || '');
            core.setOutput('tone', tone || 'Professional');

      - name: Create Notion page
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: 2fb9fcee4c6180db814ec698dd4687f4
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PLATFORMS: ${{ steps.parse.outputs.platforms }}
          HOOK: ${{ steps.parse.outputs.hook }}
          BENEFITS: ${{ steps.parse.outputs.benefits }}
          TONE: ${{ steps.parse.outputs.tone }}
        run: |
          FEATURE_NAME=$(echo "$PR_TITLE" | sed 's/^feat([^)]*): //;s/^feat: //')

          HOOK_TEXT="${HOOK:-"New feature: $FEATURE_NAME"}"
          BENEFITS_TEXT="${BENEFITS:-"See PR for details"}"
          REMARKS="Hook: $HOOK_TEXT | Benefits: $BENEFITS_TEXT | Tone: $TONE"

          PLATFORMS_JSON=$(echo "$PLATFORMS" | python3 -c "import sys,json; items=[{'name':p.strip()} for p in sys.stdin.read().split(',')]; print(json.dumps(items))")

          curl -s -X POST https://api.notion.com/v1/pages \
            -H "Authorization: Bearer $NOTION_TOKEN" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d "{
              \"parent\": { \"database_id\": \"$NOTION_DATABASE_ID\" },
              \"properties\": {
                \"Content name\": {
                  \"title\": [{ \"text\": { \"content\": \"$FEATURE_NAME\" } }]
                },
                \"Status\": {
                  \"status\": { \"name\": \"Drafting\" }
                },
                \"Platform\": {
                  \"multi_select\": $PLATFORMS_JSON
                },
                \"Post URL\": {
                  \"url\": \"$PR_URL\"
                },
                \"Remarks\": {
                  \"rich_text\": [{ \"text\": { \"content\": \"$REMARKS\" } }]
                }
              },
              \"children\": [
                {
                  \"object\": \"block\",
                  \"type\": \"heading_2\",
                  \"heading_2\": { \"rich_text\": [{ \"text\": { \"content\": \"Hook\" } }] }
                },
                {
                  \"object\": \"block\",
                  \"type\": \"paragraph\",
                  \"paragraph\": { \"rich_text\": [{ \"text\": { \"content\": \"$HOOK_TEXT\" } }] }
                },
                {
                  \"object\": \"block\",
                  \"type\": \"heading_2\",
                  \"heading_2\": { \"rich_text\": [{ \"text\": { \"content\": \"Key Benefits\" } }] }
                },
                {
                  \"object\": \"block\",
                  \"type\": \"paragraph\",
                  \"paragraph\": { \"rich_text\": [{ \"text\": { \"content\": \"$BENEFITS_TEXT\" } }] }
                },
                {
                  \"object\": \"block\",
                  \"type\": \"callout\",
                  \"callout\": {
                    \"icon\": { \"emoji\": \"🔗\" },
                    \"rich_text\": [{ \"text\": { \"content\": \"Source PR\", \"link\": { \"url\": \"$PR_URL\" } } }]
                  }
                }
              ]
            }"
